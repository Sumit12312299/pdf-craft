<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="whitePageGradHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="foldWhiteGradHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="whiteLogoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Side White PDF Icon Mark -->
  <g transform="translate(20, 10)" filter="url(#whiteLogoShadow)">
    <!-- Back Stack Layer -->
    <rect x="36" y="20" width="70" height="96" rx="12" fill="#FFFFFF" transform="rotate(-6 71 68)" opacity="0.4" />

    <!-- Main Front Document Base -->
    <path d="M 32 20 C 32 14.48 36.48 10 42 10 L 80 10 L 102 32 L 102 118 C 102 123.52 97.52 128 92 128 L 42 128 C 36.48 128 32 123.52 32 118 Z" fill="url(#whitePageGradHoriz)" />

    <!-- Dog-Ear Fold Ribbon -->
    <path d="M 80 10 L 102 32 L 86 32 C 82.69 32 80 29.31 80 26 Z" fill="url(#foldWhiteGradHoriz)" />

    <!-- Document Lines -->
    <rect x="44" y="30" width="24" height="4" rx="2" fill="#0F172A" opacity="0.8" />
    <rect x="44" y="38" width="40" height="3" rx="1.5" fill="#64748B" opacity="0.4" />
    <rect x="44" y="44" width="32" height="3" rx="1.5" fill="#64748B" opacity="0.4" />

    <!-- Inner Badge Container -->
    <g transform="translate(42, 54)">
      <rect x="0" y="0" width="50" height="56" rx="8" fill="#0F172A" />
      <text x="25" y="20" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="13" letter-spacing="1" fill="#EF4444" text-anchor="middle">PDF</text>
      <rect x="8" y="26" width="34" height="1.5" rx="0.75" fill="#334155" />
      
      <!-- Mini Scissors -->
      <circle cx="16" cy="38" r="3" stroke="#FFFFFF" stroke-width="1" fill="none" />
      <circle cx="34" cy="38" r="3" stroke="#FFFFFF" stroke-width="1" fill="none" />
      <path d="M 18 40 L 32 48 M 32 40 L 18 48" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Sparkle Star -->
    <path d="M 104 56 Q 104 62 110 62 Q 104 62 104 68 Q 104 62 98 62 Q 104 62 104 56 Z" fill="#FFFFFF" />
  </g>

  <!-- Right Side White Typography: "PDFCraft" -->
  <g transform="translate(160, 104)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5" fill="#FFFFFF">PDF</text>
    <text x="135" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="400" font-size="64" letter-spacing="-1" fill="#FFFFFF" opacity="0.9">Craft</text>

    <!-- Sparkle Star above the 't' -->
    <path d="M 312 -54 Q 312 -46 320 -46 Q 312 -46 312 -38 Q 312 -46 304 -46 Q 312 -46 312 -54 Z" fill="#FFFFFF" />

    <!-- Subtitle -->
    <text x="4" y="26" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="3" fill="#FFFFFF" opacity="0.75">CLIENT-SIDE PDF STUDIO</text>
  </g>
</svg>
